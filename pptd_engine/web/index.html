<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>演示文稿工作台</title>
  <script>
    // Theme is editor chrome only; exported slide colors come from the document.
    (() => {
      const media = matchMedia('(prefers-color-scheme: dark)');
      const apply = () => {
        let preference = 'system';
        try { preference = localStorage.getItem('ppt-as-ui-theme') || 'system'; } catch { /* Storage may be blocked. */ }
        document.documentElement.dataset.uiTheme = preference === 'dark' || (preference !== 'light' && media.matches) ? 'dark' : 'light';
      };
      apply();
      media.addEventListener('change', apply);
      addEventListener('storage', (event) => { if (event.key === 'ppt-as-ui-theme' || event.key === null) apply(); });
    })();
  </script>
  <link rel="stylesheet" href="__PPTD_RUNTIME__/katex.min.css">
  <style>
    * { box-sizing: border-box; }
    body.embedded header, body.embedded details, body.embedded #export-pptx, body.embedded #export-pdf, body.embedded .export-policy, body.embedded #export-links { display: none; }
    body.embedded main { padding: 14px; gap: 14px; width: 100%; }
    body.embedded .stage-column { width: 100%; overflow-x: hidden; }
    body.embedded #warnings { max-width: 100%; overflow-wrap: anywhere; }
    body.embedded .toolbar { padding: 10px 14px; }
    body.embedded .canvas-meta { display: none; }
    body[data-mode="preview"] aside, body[data-mode="preview"] #clear-selection { display: none; }
    body[data-mode="preview"] .element { cursor: default; }
    body.embedded aside { width: 240px; }
    @media (max-width: 850px) { main { flex-direction: column; } aside { width: 100% !important; } }

    :root { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; color: #17342d; background: #eef1ed; font-size: 14px; }
    body { margin: 0; }
    header { background: #17342d; color: #fff; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    h1 { font-size: 20px; margin: 0 0 5px; }
    header p { margin: 0; color: #bcd1c6; font-size: 12px; }
    .badge { background: #f3d494; color: #4c350b; border-radius: 5px; padding: 8px 12px; font-weight: 700; white-space: nowrap; }
    button, select, input, textarea { font: inherit; }
    button { cursor: pointer; border: 1px solid #c4cfc7; border-radius: 5px; padding: 8px 13px; color: #17342d; background: #fff; }
    button:hover { border-color: #166854; }
    button:disabled { cursor: default; opacity: .45; }
    button.primary { background: #166854; border-color: #166854; color: white; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 24px; background: #fff; border-bottom: 1px solid #d7dfd9; }
    select, input, textarea { border: 1px solid #bdcac0; border-radius: 4px; padding: 8px; background: #fff; color: #17342d; }
    #page-select { min-width: 240px; }
    #status { color: #53685d; flex: 1; font-size: 12px; }
    main { display: flex; align-items: flex-start; gap: 22px; padding: 22px 24px; }
    .stage-column { flex: 1; min-width: 0; overflow-x: auto; }
    #slide { position: relative; width: 960px; height: 540px; flex: none; overflow: hidden; background: white; color: #17342d; color-scheme: light; box-shadow: 0 5px 25px #203d2420; isolation: isolate; }
    .element { position: absolute; cursor: pointer; transform-origin: center; }
    .element.selected { outline: 2px solid #416de8; outline-offset: 3px; }
    #slide.capture .element.selected { outline: none; }
    .text-box { display: flex; flex-direction: column; }
    .rich-text { width: 100%; }
    .rich-text p { margin: 0; }
    .rich-text ul, .rich-text ol { margin: 0; padding-left: 1.4em; }
    .rich-text a { color: #2563eb; text-decoration: underline; }
    .unsupported { background: #fff2f2; border: 2px dashed #b93838; color: #ae2424; display: flex; align-items: center; justify-content: center; font: 11px/1.25 sans-serif; padding: 4px; overflow: hidden; text-align: center; }
    aside { width: 280px; flex: none; background: white; padding: 18px; border: 1px solid #d7dfd9; border-radius: 8px; }
    aside h2 { font-size: 16px; margin: 0 0 16px; }
    label { display: block; font-size: 12px; font-weight: 600; margin: 12px 0 5px; }
    #element-select, textarea { width: 100%; }
    textarea { height: 144px; font: 12px/1.6 monospace; resize: vertical; }
    .bounds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .bounds input { width: 100%; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    .hint { font-size: 12px; color: #63736b; line-height: 1.7; }
    .canvas-meta { margin: 12px 0; font-size: 12px; color: #63736b; }
    #warnings { background: #fff8e7; color: #705417; padding: 12px 16px; margin-top: 16px; border-left: 3px solid #d79032; width: 960px; font-size: 12px; line-height: 1.7; }
    #warnings ul { margin: 4px 0 0; padding-left: 20px; }
    details { margin: 0 24px 24px; background: #fff; padding: 16px; border: 1px solid #d7dfd9; border-radius: 6px; }
    summary { cursor: pointer; font-weight: 600; }
    #capabilities { white-space: pre-wrap; font-size: 12px; line-height: 1.6; }
    #font-status { font-size: 12px; color: #53685d; margin-top: 8px; }
    .table-cell { position: absolute; display: flex; flex-direction: column; padding: 6px 10px; overflow: hidden; }
    body.embedded { height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
    body.embedded .toolbar { flex: none; gap: 6px; }
    body.embedded main { flex: 1; min-height: 0; align-items: stretch; }
    body.embedded .stage-column { display: flex; align-items: center; justify-content: center; min-height: 0; overflow: hidden; }
    body.embedded aside { max-height: 100%; overflow-y: auto; }
    body.embedded #warnings, body.embedded[data-mode="preview"] .toolbar { display: none; }
    body.presenting { background: #111; }
    body.presenting .toolbar, body.presenting aside { display: none; }
    body.presenting main { padding: 0; gap: 0; }
    body.presenting #slide { box-shadow: none; }
    body.embedded.thumbnail main { padding: 0; gap: 0; }
    body.thumbnail :is(header, .toolbar, aside, details, #warnings, .canvas-meta) { display: none; }
    body.thumbnail #slide { box-shadow: none; }
    #slide:focus-visible { outline: 2px solid #416de8; outline-offset: -2px; }
    :root[data-ui-theme="dark"] { color-scheme: dark; background: #101719; color: #e7ece8; }
    :root[data-ui-theme="dark"] :is(.toolbar, aside, details) { background: #1e2629; border-color: #384640; }
    :root[data-ui-theme="dark"] :is(button, select, input, textarea) { background: #171f22; color: #c1cbc5; border-color: #384640; }
    :root[data-ui-theme="dark"] button:hover { background: #2c3839; border-color: #91ba79; }
    :root[data-ui-theme="dark"] button.primary { background: #b9d79f; color: #19271b; border-color: #b9d79f; }
    :root[data-ui-theme="dark"] :is(#status, .hint, .canvas-meta, #font-status) { color: #a2b0a8; }
    :root[data-ui-theme="dark"] #warnings { background: #3a3023; color: #e5c28c; }
    @media (max-width: 850px) {
      body.embedded main { flex-direction: column; }
      body.embedded aside { max-height: 45%; padding: 12px; }
      body.embedded #page-select { min-width: 0; max-width: 100%; flex: 1; }
      body.embedded .toolbar label { flex: none; }
      body.embedded .toolbar button { padding: 6px 9px; }
      body.embedded aside textarea { height: 80px; }
    }
  </style>
</head>
<body>
  <header>
    <div><h1>演示文稿工作台</h1><p>编辑文字与布局，播放动画，保存文档版本</p></div>
    <div class="badge">实时预览与编辑</div>
  </header>
  <div class="toolbar">
    <label for="page-select" style="margin:0">页面</label><select id="page-select" aria-label="切换页面"></select>
    <button id="reload" type="button">重新加载</button>
    <button id="clear-selection" type="button">取消选择</button>
    <button id="animation-play" type="button" disabled>播放动画</button>
    <button id="animation-next" type="button" disabled>下一步</button>
    <button id="animation-reset" type="button" disabled>重置动画</button>
    <span id="animation-status" aria-live="polite"></span>
    <button id="export-pptx" type="button">导出 PPTX</button>
    <button id="export-pdf" type="button">导出 PDF</button>
    <label class="export-policy" style="margin:0;font-weight:400"><input id="allow-vector-charts" type="checkbox" checked>复杂图表按可编辑矢量导出</label>
    <span id="export-links"></span>
    <span id="status" role="status" aria-live="polite">正在读取 PPTD…</span>
  </div>
  <main>
    <section class="stage-column" aria-label="幻灯片预览">
      <div id="slide" data-page-index="0" data-ready="false" aria-label="PPTD 幻灯片画布" tabindex="0"></div>
      <p class="canvas-meta" id="canvas-meta"></p>
      <div id="warnings" role="note"><strong>能力与呈现提示</strong><ul id="warning-list"></ul></div>
    </section>
    <aside>
      <h2>元素编辑</h2>
      <label for="element-select">选择元素</label><select id="element-select" aria-label="选择元素"></select>
      <label for="text-content">文本内容（富文本源）</label><textarea id="text-content" aria-label="文本内容" spellcheck="false" disabled></textarea>
      <div class="bounds">
        <div><label for="bound-x">X / px</label><input id="bound-x" aria-label="X 坐标" type="number" step="any" disabled></div>
        <div><label for="bound-y">Y / px</label><input id="bound-y" aria-label="Y 坐标" type="number" step="any" disabled></div>
        <div><label for="bound-w">宽 / px</label><input id="bound-w" aria-label="宽度" type="number" min="0" step="any" disabled></div>
        <div><label for="bound-h">高 / px</label><input id="bound-h" aria-label="高度" type="number" min="0" step="any" disabled></div>
      </div>
      <div class="actions"><button id="preview" type="button" disabled>预览修改</button><button id="save" class="primary" type="button" disabled>保存到 PPTD</button></div>
      <p class="hint">保存会更新所选元素并创建新版本。导出使用已保存的内容；预览修改后请先保存。</p>
    </aside>
  </main>
  <details><summary>完整能力报告（含未支持项）</summary><div id="font-status"></div><pre id="capabilities"></pre></details>
  <script src="__PPTD_RUNTIME__/pptd-runtime.js"></script>
  <script>
    'use strict';
    const config = __PPTD_CONFIG__;
    const api = (path) => config.apiBase + path;
    const viewParams = new URLSearchParams(window.location.search);
    const thumbnail = viewParams.get('thumbnail') === '1';
    const editable = !thumbnail && viewParams.get('mode') !== 'preview';
    document.body.dataset.mode = editable ? 'edit' : 'preview';
    if (config.embed) document.body.classList.add('embedded');
    if (thumbnail) { document.body.classList.add('thumbnail'); document.body.inert = true; }
    const tellParent = (message) => { if (window.parent !== window) window.parent.postMessage({ ...message, projectId: config.projectId }, window.location.origin); };
    const $ = (id) => document.getElementById(id);
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const state = { document: null, pages: [], pageIndex: 0, selected: null, warnings: new Set(), fontWarnings: [], fontIssues: [], fonts: [], capabilities: null };
    const palette = ['#1783FE', '#67B8A6', '#C9A869', '#8A84C7', '#8C98A8', '#5E9CF4', '#7AB5D7', '#B08A9C', '#333333', '#DCDCDC'];
    let imagePromises = [];
    let renderRevision = 0;
    let animationPlayer = null;
    let presenting = false;
    let lastWheelAt = -Infinity, wheelDelta = 0, wheelLatched = false;
    const chartViews = new Map();
    const loadedFontFaces = new Map();

    function warn(message) { state.warnings.add(message); }
    function status(message) { $('status').textContent = message; }
    function color(value, seen = new Set()) {
      if (typeof value !== 'string') return '#000000';
      if (value.startsWith('$')) {
        const key = value.slice(1);
        if (seen.has(key) || !state.document.theme?.colors?.[key]) { warn('无法解析主题色 ' + value + '；显示黑色。'); return '#000000'; }
        seen.add(key);
        return color(state.document.theme.colors[key], seen);
      }
      return /^#[0-9a-f]{6}([0-9a-f]{2})?$/i.test(value) ? value : (warn('非规范颜色 ' + value + '；显示黑色。'), '#000000');
    }
    function themeStyle(reference, kind = 'textStyles') {
      if (!reference) return {};
      if (typeof reference === 'object') return reference;
      if (typeof reference !== 'string' || !reference.startsWith('$')) { warn('未解析样式引用：' + reference); return {}; }
      const style = state.document.theme?.[kind]?.[reference.slice(1)];
      if (!style) warn('不存在的主题样式：' + reference);
      return style || {};
    }
    function fontFamily(value) {
      if (typeof value === 'object' && value) value = [value.latin, value.ea].filter(Boolean).join(',');
      const source = value || 'MiSans';
      const names = String(source).split(',').map((name) => name.trim().replace(/^['"]|['"]$/g, ''));
      const mapped = names.flatMap((name) => name === '思源黑体' ? ['思源黑体', 'Noto Sans CJK SC'] : [name]);
      return [...mapped.map((name) => '"' + name.replace(/["\\]/g, '') + '"'), '"Noto Sans CJK SC"', 'sans-serif'].join(', ');
    }
    function textStyle(node, style) {
      const s = node.style;
      s.color = color(style.color ?? '#000000');
      s.fontSize = (style.fontSize ?? 18) + 'px';
      s.fontFamily = fontFamily(style.fontFamily);
      if (style.fontFamily && typeof style.fontFamily === 'object') node.dataset.fontRouting = JSON.stringify(style.fontFamily);
      s.fontWeight = style.bold ? '700' : '400';
      s.fontStyle = style.italic ? 'italic' : 'normal';
      s.lineHeight = style.lineHeightPx != null ? style.lineHeightPx + 'px' : String(style.lineHeight ?? 1);
      s.letterSpacing = (style.letterSpacing ?? 0) + 'px';
      if (style.backgroundColor) s.backgroundColor = color(style.backgroundColor);
      if (style.marginTop) node.style.setProperty('--paragraph-margin', style.marginTop + 'px');
    }
    function richText(text, inherited = {}) {
      const destination = document.createElement('div');
      destination.className = 'rich-text';
      const value = String(text ?? '');
      const allowed = new Set(['P', 'SPAN', 'STRONG', 'EM', 'U', 'S', 'SUP', 'SUB', 'A', 'UL', 'OL', 'LI']);
      const dangerous = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'LINK', 'META', 'IMG', 'SVG', 'MATH']);
      const styleAllowlist = {
        P: ['text-align', 'line-height', 'margin-top', 'margin-left', 'margin-right'],
        LI: ['text-align', 'line-height', 'letter-spacing', 'margin-top', 'margin-left', 'list-style-type', 'list-style-position'],
        SPAN: ['color', 'font-size', 'font-family', 'background-color'],
      };
      function cloneSafe(source) {
        if (source.nodeType === Node.TEXT_NODE) return document.createTextNode(source.textContent);
        if (source.nodeType !== Node.ELEMENT_NODE) return document.createDocumentFragment();
        if (dangerous.has(source.tagName)) { warn('已隔离未支持/不安全富文本标签：' + source.tagName.toLowerCase()); return document.createDocumentFragment(); }
        const node = allowed.has(source.tagName) ? document.createElement(source.tagName.toLowerCase()) : document.createDocumentFragment();
        if (!allowed.has(source.tagName)) warn('未支持富文本标签 ' + source.tagName.toLowerCase() + '；仅显示子文本。');
        if (source.tagName === 'P' && inherited.marginTop) node.style.marginTop = inherited.marginTop + 'px';
        if (node instanceof HTMLElement && styleAllowlist[source.tagName]) {
          for (const declaration of (source.getAttribute('style') || '').split(';')) {
            const split = declaration.indexOf(':');
            if (split < 0) continue;
            const property = declaration.slice(0, split).trim().toLowerCase();
            let val = declaration.slice(split + 1).trim();
            if (!styleAllowlist[source.tagName].includes(property) || /url\s*\(|expression\s*\(|@import|[{}]/i.test(val)) { warn('富文本样式未支持或已隔离：' + property); continue; }
            if (property === 'color' || property === 'background-color') val = color(val);
            if (property === 'font-family') val = fontFamily(val);
            if (property === 'text-align' && val === 'distributed') { node.style.textAlignLast = 'justify'; val = 'justify'; }
            node.style.setProperty(property, val);
          }
        }
        if (source.tagName === 'A') {
          const href = source.getAttribute('href') || '';
          if (/^(https?:\/\/|mailto:)/i.test(href)) { node.href = href; node.rel = 'noopener noreferrer'; node.target = '_blank'; }
          else warn('已移除非 HTTP(S)/mailto 的富文本链接。');
        }
        for (const child of source.childNodes) node.append(cloneSafe(child));
        return node;
      }
      if (!/<\/?[a-z][^>]*>/i.test(value)) {
        for (const line of value.split(/\r?\n/)) { const p = document.createElement('p'); p.textContent = line || '\u00a0'; if (inherited.marginTop) p.style.marginTop = inherited.marginTop + 'px'; destination.append(p); }
      } else {
        const parsed = new DOMParser().parseFromString(value, 'text/html');
        for (const child of parsed.body.childNodes) destination.append(cloneSafe(child));
      }
      return destination;
    }
    function align(node, alignment = ['left', 'top']) {
      node.style.textAlign = alignment[0] === 'distributed' ? 'justify' : alignment[0];
      if (alignment[0] === 'distributed') node.style.textAlignLast = 'justify';
      node.style.justifyContent = { top: 'flex-start', middle: 'center', bottom: 'flex-end' }[alignment[1]] || 'flex-start';
    }
    function svgElement(name, attrs = {}, content) {
      const node = document.createElementNS(SVG_NS, name);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, String(value));
      if (content != null) node.textContent = content;
      return node;
    }
    function makeSvg(width, height) { return svgElement('svg', { width: '100%', height: '100%', viewBox: `0 0 ${width} ${height}`, preserveAspectRatio: 'none', style: 'display:block;overflow:visible' }); }
    function fill(node, config) {
      if (!config) return;
      if (config.type === 'solid') node.style.backgroundColor = color(config.color);
      else if (config.type === 'gradient') {
        const stops = (config.stops || []).map((stop) => `${color(stop.color)} ${stop.position * 100}%`).join(', ');
        node.style.backgroundImage = config.gradientType === 'radial' ? `radial-gradient(${stops})` : `linear-gradient(${(config.angle ?? 0) + 90}deg, ${stops})`;
        warn('渐变由浏览器近似呈现；未验证与 Kimi 的色彩插值一致。');
      } else { warn('图像填充未实现；保留原始字段。'); }
    }
    function borderCss(border) { return !border ? 'none' : `${border.width ?? 1}px ${ {solid: 'solid', dash: 'dashed', dot: 'dotted'}[border.style || 'solid']} ${color(border.color || '#000000')}`; }
    function borders(node, value) {
      if (value === undefined) return;
      if (!Array.isArray(value)) { node.style.border = borderCss(value); return; }
      const sides = value.length === 2 ? [value[0], value[1], value[0], value[1]] : value;
      ['Top', 'Right', 'Bottom', 'Left'].forEach((name, i) => { node.style['border' + name] = borderCss(sides[i]); });
    }
    function shadow(node, config, text = false) {
      if (!config) return;
      node.style[text ? 'textShadow' : 'boxShadow'] = `${config.offset?.[0] || 0}px ${config.offset?.[1] || 0}px ${config.blur}px ${color(config.color)}`;
      warn('阴影采用浏览器 CSS；模糊半径与参考引擎未做视觉等价验证。');
    }
    function placeholder(node, message) { node.classList.add('unsupported'); node.textContent = message; node.dataset.unsupported = 'true'; warn(message); }
    function renderText(node, element) {
      const content = element.content || {};
      const style = { ...themeStyle(content.style), ...content };
      node.classList.add('text-box');
      textStyle(node, style); align(node, content.align);
      node.style.whiteSpace = content.wrap === false ? 'nowrap' : 'normal';
      if (content.textDirection === 'vertical') warn('竖排文字未实现；显示为水平文字并保留字段。');
      if (content.gradient) warn('文字渐变未实现；使用已解析文字颜色。');
      shadow(node, content.shadow, true);
      node.append(richText(content.text, style));
    }
    const DEFAULT_SHAPE_ADJUSTMENT = 50000;
    const PRESET_SHAPE_PATHS = {
      homePlate: (w, h, adjustment) => {
        const tip = Math.min(w, h) * (adjustment / 100000);
        return `M 0 ${h / 2} L ${tip} 0 L ${w} 0 L ${w} ${h} L ${tip} ${h} Z`;
      },
      chevron: (w, h, adjustment) => {
        const tip = Math.min(w, h) * (adjustment / 100000);
        return `M 0 0 L ${w - tip} 0 L ${w} ${h / 2} L ${w - tip} ${h} L 0 ${h} L ${tip} ${h / 2} Z`;
      },
    };
    let gradientSerial = 0;
    function gradientPaint(svg, config) {
      const id = 'pptd-gradient-' + (++gradientSerial);
      const defs = svgElement('defs');
      let gradient;
      if (config.gradientType === 'radial') {
        gradient = svgElement('radialGradient', { id, cx: '50%', cy: '50%', r: '50%' });
      } else {
        const angle = ((config.angle ?? 0) * Math.PI) / 180, dx = Math.cos(angle) / 2, dy = Math.sin(angle) / 2;
        gradient = svgElement('linearGradient', { id, x1: String(0.5 - dx), y1: String(0.5 - dy), x2: String(0.5 + dx), y2: String(0.5 + dy) });
      }
      for (const stop of config.stops) gradient.append(svgElement('stop', { offset: `${(stop.position ?? 0) * 100}%`, 'stop-color': color(stop.color) }));
      defs.append(gradient); svg.append(defs);
      return `url(#${id})`;
    }
    function vectorPaint(svg, config, fallback) {
      if (!config) return fallback;
      if (config.type === 'solid') return color(config.color);
      if (config.type === 'gradient') {
        if (!Array.isArray(config.stops) || config.stops.length < 2) { warn('渐变缺少色标；以纯色近似。'); return fallback; }
        return gradientPaint(svg, config);
      }
      warn('图像填充未实现；此形状仅显示外框。');
      return fallback;
    }
    function renderVectorShape(node, element, path, viewBox) {
      const [vw, vh] = viewBox;
      if (!(vw > 0) || !(vh > 0)) return placeholder(node, '无效的形状坐标空间');
      const svg = makeSvg(vw, vh);
      const border = element.border || {};
      svg.append(svgElement('path', {
        d: path, fill: vectorPaint(svg, element.fill, 'none'), 'fill-rule': 'nonzero', 'clip-rule': 'nonzero',
        stroke: element.border ? color(border.color || '#000000') : 'none',

      else if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) navigate(1);
    });
    $('slide').parentElement.addEventListener('wheel', (event) => {
      if (!config.embed || (editable && !presenting) || event.ctrlKey || event.metaKey || event.shiftKey || Math.abs(event.deltaX) > Math.abs(event.deltaY) || !event.deltaY) return;
      event.preventDefault();
      const now = performance.now();
      // A quiet gap ends a trackpad gesture; inertia cannot race through the deck.
      if (now - lastWheelAt > 180) { wheelDelta = 0; wheelLatched = false; }
      lastWheelAt = now;
      if (wheelLatched) return;
      const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1);
      if (Math.sign(delta) !== Math.sign(wheelDelta)) wheelDelta = 0;
      wheelDelta += delta;
      if (Math.abs(wheelDelta) >= 45) { wheelLatched = true; navigate(Math.sign(wheelDelta)); }
    }, { passive: false });
    window.pptdWorkbench = window.pptdProbe = { state, reload: loadDocument, select: selectElement, render: renderPage, animation: animationControl, get animationPlayer() { return animationPlayer; } };
    if (config.embed) {
      const observer = new ResizeObserver(fitCanvas);
      observer.observe($('slide').parentElement);
      window.addEventListener('resize', fitCanvas);
    }
    window.probeReady = loadDocument().catch((error) => {
      status('读取失败：' + error.message); document.body.dataset.error = error.message;
      if (thumbnail) tellParent({ type: 'pptd:thumbnail-error' });
      throw error;
    });
  </script>
</body>
</html>
